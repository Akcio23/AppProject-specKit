services:
  postgres:
    image: postgres:17-alpine
    container_name: biblia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_secret_local}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - biblia_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: biblia_mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"   # SMTP port
      - "${MAILPIT_HTTP_PORT:-8025}:8025"   # Web UI para inspecionar e-mails
    networks:
      - biblia_network

volumes:
  postgres_data:
    name: biblia_postgres_data

networks:
  biblia_network:
    name: biblia_network
    driver: bridge
